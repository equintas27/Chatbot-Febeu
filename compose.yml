services:
  postgresql:
    image: postgres:17
    container_name: postgresql
    restart: on-failure
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
    - febeu_network
  
  fastapi:
    image: fastapi:1.0
    container_name: fastapi
    restart: on-failure
    build : 
      context: .
    ports:
      - 8000:8000
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    env_file:
      - .env
    secrets:
      - postgres_password
    networks:
      - febeu_network
  
  chromadb:
    image: chromadb/chroma:1.5.9
    container_name: chromadb
    restart: on-failure
    volumes: 
    - chroma_data:/chroma/chroma
    networks:
      - febeu_network

networks:
  febeu_network:
    driver: bridge

volumes:
  postgres_data:
  chroma_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt