services:
  mariadb:
    image: mariadb:1.0
    pull_policy: never
    container_name: mariadb
    build:
      context: ./requirements/mariadb
    restart: on-failure
    environment:
      MYSQL_DB: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_ADMIN_USER: ${MYSQL_ADMIN_USER}
    secrets:
      - db_admin_password
      - db_normal_password
      - db_root_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception_network
  
  wordpress:
    image: wordpress:1.0
    pull_policy: never
    container_name: wordpress
    build:
      context: ./requirements/wordpress
    restart: on-failure
    depends_on:
      - mariadb
    environment:
      - MYSQL_DB=${MYSQL_DB}
      - MYSQL_ADMIN_USER=${MYSQL_ADMIN_USER}
      - DB_HOST=${DB_HOST}
      - DOMAIN_NAME=${DOMAIN_NAME}
      - WP_ADMIN_USER=${WP_ADMIN_USER}
      - WP_ADMIN_EMAIL=${WP_ADMIN_EMAIL}
      - WP_USER=${WP_USER}
      - WP_USER_EMAIL=${WP_USER_EMAIL}
    secrets:
      - db_admin_password
      - wp_admin_password
      - wp_normal_password
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception_network

  nginx:
    image: nginx:1.0
    pull_policy: never
    container_name: nginx
    build:
      context: ./requirements/nginx
    restart: on-failure
    depends_on:
      - wordpress
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception_network

volumes:
  mariadb_data:
    name: mariadb_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${LOGIN}/data/mariadb
  wordpress_data:
    name: wordpress_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${LOGIN}/data/wordpress

networks:
  inception_network:
    name: inception_network
    driver: bridge

secrets:
  db_admin_password:
    file: ../secrets/db_admin_password.txt
  db_normal_password:
    file: ../secrets/db_normal_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_normal_password:
    file: ../secrets/wp_normal_password.txt
